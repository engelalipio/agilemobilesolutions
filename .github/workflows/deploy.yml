name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AgileMobileSolutions.sln

      - name: Build with MSBuild
        run: msbuild AgileMobileSolutions.sln /p:Configuration=Release /p:OutputPath=publish_output\bin

      - name: Copy web content
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish_output | Out-Null
          robocopy . publish_output /E /XD .git .github packages obj bin publish_output node_modules ClientApp
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: agilemobilesolutions
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: publish_output
