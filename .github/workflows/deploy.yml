name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AgileMobileSolutions.sln

      - name: Build with MSBuild
        run: msbuild AgileMobileSolutions.sln /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=Properties/PublishProfiles/AgileMobileSolutions.pubxml /p:PackageAsSingleFile=true /p:OutDir=publish_output

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: agilemobilesolutions
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: publish_output
